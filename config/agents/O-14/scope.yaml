agent_id: O-14
name: Metrics Specialist
category: observability
version: 0.1.0
description: >
  Evaluates metrics instrumentation, dashboards, and SLO tracking.

scanner_signals:
    - observability.metrics

evaluation:
  primary_file_patterns: []
