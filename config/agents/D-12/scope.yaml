agent_id: D-12
name: Query Performance Specialist
category: data
version: 0.1.0
description: >
  Evaluates query performance, index coverage, and N+1 detection.

scanner_signals:
    - data.indexing

evaluation:
  primary_file_patterns: []
  secondary_file_patterns: []
  confidence_floor: 0.3
  presets:
    - absence_when_no_signals
    - misconfiguration_on_anti_pattern

output:
  concepts_owned: data.indexing
  report_section: "Query Performance Specialist findings"
  priority_default: medium
