agent_id: D-25
name: Health Check Specialist
category: deployment
version: 0.1.0
description: >
  Evaluates health check endpoint design and readiness/liveness probe configuration.

scanner_signals:
    - deployment.healthchecks

evaluation:
  primary_file_patterns: []
  secondary_file_patterns: []
  confidence_floor: 0.3
  presets:
    - absence_when_no_signals
    - misconfiguration_on_anti_pattern

output:
  concepts_owned: deployment.healthchecks
  report_section: "Health Check Specialist findings"
  priority_default: medium
