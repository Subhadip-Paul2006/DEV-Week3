agent_id: F-03
name: Logging Architect
category: foundation
version: 0.1.0
description: >
  Evaluates logging architecture, log levels, structured output, and log aggregation readiness.

scanner_signals:
    - foundation.logging

evaluation:
  primary_file_patterns: []
  secondary_file_patterns: []
  confidence_floor: 0.3
  presets:
    - absence_when_no_signals
    - misconfiguration_on_anti_pattern

output:
  concepts_owned: foundation.logging
  report_section: "Logging Architect findings"
  priority_default: medium
